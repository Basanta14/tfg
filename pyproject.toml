[build-system]
requires = ["uv_build >= 0.13.4, <0.14.0"]
build-backend = "uv_build"

[project]
author = {name = "Alejandro Basanta", email = "alejandrobasantaa@gmail.com"}
name = "TFG"
license = "MIT"
version = "26.1.0"
requires-python = ">=3.12"
dependencies = [
  "pathlib",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
